name: Kontenjan Takip

on:
  schedule:
    - cron: "*/30 * * * *"   # yedek: zincir koparsa yeniden başlatır
  workflow_dispatch:          # elle başlatma butonu

# Aynı anda tek çalışma olsun; yenisi eskisinin bitmesini beklesin
concurrency:
  group: kontenjan
  cancel-in-progress: false

permissions:
  actions: write     # bir sonraki çalışmayı başlatabilmek için
  contents: read

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Baslangic zamanini kaydet
        run: echo "BOT_BASLANGIC=$(date +%s)" >> "$GITHUB_ENV"

      - name: Botu calistir
        run: python kontenjan_bot.py
        continue-on-error: true
        env:
          CALISMA_SURESI_DK: "330"   # 5,5 saat çalış
          NTFY_KONU: ${{ secrets.NTFY_KONU }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OBS_KULLANICI: ${{ secrets.OBS_KULLANICI }}
          OBS_SIFRE: ${{ secrets.OBS_SIFRE }}

      # Zincir: bitince bir sonraki çalışmayı kendisi başlatır
      # (Elle "Cancel" edersen zincir durur)
      # Bot 5 dakikadan kısa sürede kapandıysa (çökme) zinciri durdurur ki
      # saniyeler içinde sonsuz çalışma döngüsü oluşmasın; 30 dk'lık cron yeniden dener.
      - name: Sonraki calismayi baslat
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GECEN=$(( $(date +%s) - BOT_BASLANGIC ))
          if [ "$GECEN" -lt 300 ]; then
            echo "::error::Bot ${GECEN} sn içinde kapandı (muhtemelen çöktü). Zincir durduruldu, 'Botu calistir' adımının loguna bak."
            exit 1
          fi
          gh workflow run kontenjan.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
