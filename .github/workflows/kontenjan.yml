name: Kontenjan Takip

on:
  schedule:
    - cron: "*/30 * * * *"   # yarım saatte bir yeni çalışma
  workflow_dispatch:          # elle başlatma butonu

# Aynı anda tek çalışma olsun; yenisi eskisinin bitmesini beklesin
concurrency:
  group: kontenjan
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python kontenjan_bot.py
        env:
          CALISMA_SURESI_DK: "55"
          NTFY_KONU: ${{ secrets.NTFY_KONU }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
